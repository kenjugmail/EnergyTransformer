[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "energy-transformer-research"
version = "0.16.0"
description = "Experimental function-state and protected-memory text bridge"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24"]
[project.optional-dependencies]
test = ["pytest>=8", "safetensors>=0.4"]
campaign = ["datasets>=3,<5", "pandas>=2.2,<3", "scipy>=1.14,<2", "transformers==4.57.6"]
forecast = ["numpy>=1.26", "pandas>=2.2"]
portable = ["safetensors>=0.4"]
hub = ["safetensors>=0.4", "huggingface_hub>=1.0"]
[tool.setuptools.packages.find]
include = ["energy_transformer*", "energy_real*", "energy_forecast*", "energy_campaign*"]

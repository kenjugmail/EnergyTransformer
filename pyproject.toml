[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "energy-transformer-research"
version = "0.16.0"
description = "Experimental function-state and protected-memory text bridge"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24"]
[project.optional-dependencies]
test = ["pytest>=8", "safetensors>=0.4"]
portable = ["safetensors>=0.4"]
hub = ["safetensors>=0.4", "huggingface_hub>=1.0"]
lfm-conversion = ["transformers==5.21.0", "accelerate==1.15.0", "huggingface_hub==1.33.0", "safetensors>=0.8", "pyarrow==26.0.0"]
[tool.setuptools.packages.find]
include = ["energy_transformer*", "energy_real*", "rewt*"]

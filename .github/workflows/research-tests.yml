name: Source-only research tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]' -e './spark_kit[test]'
      - name: Root research suite
        run: python -m pytest tests -q
      - name: Repaired kernel, trainer, and reasoning suite
        run: python -m pytest tests_real -q
      - name: Source-only Spark suite
        working-directory: spark_kit
        run: python -m pytest tests -q -m 'not integration'
